<div class="canvas" [class.focus-mode]="editorState.sidebarCollapsed">

  <!-- Área do canvas com scroll independente -->
  <div
    class="free-canvas-wrap"
    #canvasWrap
    (click)="editorState.selectNode(null)"
  >
    <div
      class="free-canvas"
      #freeCanvas
      [style.transform]="'scale(' + canvasZoom + ')'"
      [style.transform-origin]="'top left'"
      (dragover)="onCanvasDragOver($event)"
      (dragleave)="onCanvasDragLeave($event)"
      (drop)="onCanvasDrop($event)"
      [class.drag-ready]="isDraggingOverCanvas"
    >
      @for(component of editorState.pageComponents; track component.id){
        <app-component-renderer
          [component]="component"
          [sectionId]="editorState.canvasSectionId"
        />
      }

      @if(editorState.pageComponents.length === 0){
        <div class="canvas-empty">
          <div class="canvas-empty-icon">&#8853;</div>
          <p>Clique em um componente na toolbox</p>
          <p class="canvas-empty-sub">ou arraste até aqui</p>
        </div>
      }
    </div>
  </div>

  <!-- Controles de zoom flutuantes -->
  <div class="zoom-controls" (click)="$event.stopPropagation()">
    <button class="zoom-btn" (click)="zoomOut()" title="Diminuir zoom (Ctrl+Scroll)">&#8722;</button>
    <span class="zoom-label" (click)="zoomReset()" title="Resetar zoom">{{ zoomPct }}</span>
    <button class="zoom-btn" (click)="zoomIn()" title="Aumentar zoom (Ctrl+Scroll)">&#43;</button>
    <button class="zoom-btn zoom-fit-btn" (click)="zoomFit()" title="Ajustar à tela">&#9974;</button>
  </div>

  <!-- Botão flutuante "Editar" no modo foco -->
  @if(editorState.sidebarCollapsed){
    <button class="focus-edit-btn" (click)="editorState.sidebarCollapsed = false" title="Voltar ao modo edição">
      &#9998; Editar
    </button>
  }

</div>
