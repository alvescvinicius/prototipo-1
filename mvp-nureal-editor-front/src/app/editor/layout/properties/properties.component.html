<div class="properties">

  <h3>Properties</h3>

  @if(editorState.selectedNode){

    <div class="property-group">

      <label>Nome</label>

      <input
        type="text"
        [(ngModel)]="editorState.selectedNode.name"
      >

    </div>

    <div class="property-group">

      <label>Tipo</label>

      <input
        type="text"
        [value]="editorState.selectedNode.type"
        readonly
      >

    </div>

    @if(editorState.selectedNode.type === ComponentType.TEXT){

      <div class="property-group">

        <label>Conteúdo</label>

        <textarea
          rows="5"
          [(ngModel)]="editorState.selectedNode.config.content"
        ></textarea>

      </div>

    }

  } @else {

    <p>Nenhum componente selecionado</p>

  }

</div>
