<div class="tree-root" (click)="editorState.selectNode(null); editorState.selectPage(null)">

  <!-- Project root -->
  <div class="tree-project-row">
    <span class="tree-node-icon">&#128196;</span>
    <span class="tree-page-label">{{ editorState.projectName }}</span>
  </div>

  @for(page of editorState.pages; track page.id){
    <div class="tree-page-block">

      <!-- Page row -->
      <div
        class="tree-row tree-level-0"
        [class.selected]="editorState.selectedPage?.id === page.id"
        (click)="editorState.switchPage(page.id); editorState.selectPage(page); $event.stopPropagation()"
        (dblclick)="editorState.switchPage(page.id); editorState.selectPage(page); editorState.pagePropertiesModalOpen = true; $event.stopPropagation()"
      >
        <button class="tree-toggle" (click)="togglePage(page, $event)" title="Expandir/Recolher">
          <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            @if(isPageExpanded(page)){
              <polyline points="6 9 12 15 18 9"/>
            } @else {
              <polyline points="9 6 15 12 9 18"/>
            }
          </svg>
        </button>
        <span class="tree-icon">&#128196;</span>
        <span class="tree-label">{{ page.name }}</span>
        <span class="tree-badge page-badge">PAG</span>
      </div>

      <!-- Components direto (sem mostrar canvas/section) -->
      @if(isPageExpanded(page) && editorState.currentPage?.id === page.id){
        @for(comp of editorState.pageComponents; track comp.id){
          <app-tree-node [node]="comp" [depth]="1" />
        }
      }

    </div>
  }

</div>
