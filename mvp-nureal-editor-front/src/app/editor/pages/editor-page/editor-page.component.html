<app-component-modal></app-component-modal>

<div class="editor-shell">

  <!-- Left Rail -->
  <app-editor-left-rail></app-editor-left-rail>

  <!-- Canvas -->
  <div class="canvas-wrap" [class.split]="editorState.splitView">
    <app-canvas></app-canvas>
    @if(editorState.splitView) {
      <div class="preview-pane">
        <app-preview-page [embedded]="true" />
      </div>
    }
  </div>

  <!-- Right Panel -->
  <app-editor-right-panel></app-editor-right-panel>

</div>
