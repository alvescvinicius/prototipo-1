<div class="editor">

  <app-editor-header></app-editor-header>

  <div class="editor-body">

    <app-toolbox></app-toolbox>

    <app-canvas></app-canvas>

    <div class="sidebar-width-resizer" (mousedown)="startSidebarResize()"></div>

    <div class="editor-sidebar" [style.width.px]="sidebarWidth">

      <!-- Tabs do sidebar -->
      <div class="sidebar-tabs">
        <button
          class="sidebar-tab-btn"
          [class.active]="sidebarTab === 'properties'"
          (click)="sidebarTab = 'properties'"
        >Propriedades</button>
        <button
          class="sidebar-tab-btn"
          [class.active]="sidebarTab === 'structure'"
          (click)="sidebarTab = 'structure'"
        >Estrutura</button>
      </div>

      <!-- Conteudo das tabs -->
      <div class="sidebar-tab-content">
        @if(sidebarTab === 'properties'){
          <app-properties></app-properties>
        }
        @if(sidebarTab === 'structure'){
          <app-page-tree></app-page-tree>
        }
      </div>

    </div>
  </div>
</div>
