<app-component-modal></app-component-modal>

<!-- Modal de propriedades da página -->
@if(editorState.pagePropertiesModalOpen && editorState.selectedPage){
  <div class="page-modal-backdrop" (click)="editorState.pagePropertiesModalOpen = false">
    <div class="page-modal-panel" (click)="$event.stopPropagation()" (keydown.enter)="editorState.pagePropertiesModalOpen = false">
      <div class="page-modal-header">
        <span class="page-modal-badge">PAG</span>
        <span class="page-modal-name">{{ editorState.selectedPage.name }}</span>
        <button class="page-modal-close" (click)="editorState.pagePropertiesModalOpen = false">&#10005;</button>
      </div>
      <div class="page-modal-body">
        <app-page-properties></app-page-properties>
      </div>
    </div>
  </div>
}

<div class="editor">

  <app-editor-header></app-editor-header>

  <div class="editor-body">

    <!-- Sidebar esquerdo unificado -->
    <div
      class="editor-sidebar"
      [class.collapsed]="editorState.sidebarCollapsed"
      [style.width.px]="editorState.sidebarCollapsed ? 0 : sidebarWidth"
    >
      <!-- Estrutura (navegação — sempre visível) -->
      <div class="sidebar-section-header">
        <span class="sidebar-section-icon">&#8942;</span>
        Estrutura
      </div>
      <div class="sidebar-tree-area">
        <app-page-tree></app-page-tree>
      </div>

      <!-- Divider + Componentes (sempre visível) -->
      <div class="sidebar-section-header sidebar-section-components">
        <span class="sidebar-section-icon">&#8853;</span>
        Componentes
      </div>
      <div class="sidebar-components-area">
        <app-toolbox></app-toolbox>
      </div>
    </div>

    @if(!editorState.sidebarCollapsed){
      <div class="sidebar-width-resizer" (mousedown)="startSidebarResize()"></div>
    }

    <button
      class="sidebar-collapse-btn"
      (click)="toggleSidebar()"
      [title]="editorState.sidebarCollapsed ? 'Expandir painel' : 'Recolher painel'"
    >
      @if(editorState.sidebarCollapsed){ &#9655; } @else { &#9654; }
    </button>

    <div class="canvas-area" [class.split]="splitView">
      <app-canvas></app-canvas>

      @if(splitView){
        <div class="preview-pane">
          <app-preview-page [embedded]="true" />
        </div>
      }
    </div>

  </div>
</div>
